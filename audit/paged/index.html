<!doctype html>

<body>
<!--
  This is the Paged.js parallel track. It consumes the same JSON that the
  Typst pipeline does, but renders pages in the browser via Paged.js so we
  can debug the 8-zone layout visually in DevTools and produce a PDF via
  Chrome's "Print to PDF" for comparison.

  Populate #content at build time with a Node pre-processor (not included
  here) that:
    1. Reads source_uploads/docx_content_with_notes.json
    2. Classifies each block per pagination_study.md §1.1
    3. Emits HTML with <section class="chapter-opener">, <h3 class="subtitle">,
       <p class="body">, and <span class="fn-call" data-note="…">[א]</span>
    4. Wraps each note body into <aside class="footnote">…</aside>
-->
<main id="content" class="sefer">
  <!-- Example stub content (replace with real output from Node builder). -->
  <section class="chapter-opener">
    <div class="cartouche">פרק א</div>
    <h2 class="chapter-title">הַשִּׁיר וְהַשֶּׁבַח לְחַי עוֹלָמִים</h2>
  </section>
  <h3 class="subtitle">הנסים והנפלאות נמשכים לדורות</h3>
  <p class="body">
    א. מצוה עלינו להודות ולשבח להקב"ה בכל דור ודור על כל הנסים והנפלאות
    <span class="fn-call" data-note="fn1">[א]</span>.
    <aside class="fn" id="fn1">
      <span class="fn-marker">[א]</span>
      פרשת תזריע (ד"ה א"י אשה): ...
    </aside>
  </p>
</main>
</body>
</html>
